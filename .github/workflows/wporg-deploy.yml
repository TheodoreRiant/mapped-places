# Publication sur le répertoire wordpress.org (SVN) à chaque tag de version,
# ou à la main pour un tag déjà poussé (Actions → Run workflow → le tag).
#
# Actif depuis l'acceptation du plugin (28/09/2026) : variable de dépôt
# WPORG_DEPLOY = true, secrets SVN_USERNAME et SVN_PASSWORD (le « SVN
# password » du profil wordpress.org du compte qui a soumis le plugin, pas
# le mot de passe du compte). Le contenu déployé est celui du build
# wordpress.org : .distignore en fait la liste (sans fichiers de traduction,
# le répertoire fournit les paquets de langue).
name: Deploy to WordPress.org

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.WPORG_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to the plugin directory (trunk and tags/<version>)
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mapped-places
          ASSETS_DIR: .wordpress-org
