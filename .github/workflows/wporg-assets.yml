# Mise à jour de la page du répertoire wordpress.org (readme, icône, bannière,
# captures, blueprint) sans nouvelle version, quand ils changent sur main.
#
# Inactif tant que la variable de dépôt WPORG_DEPLOY ne vaut pas « true »
# (voir wporg-deploy.yml).
name: WordPress.org readme and assets

on:
  push:
    branches: [main]
    paths:
      - 'readme.txt'
      - '.wordpress-org/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    if: ${{ vars.WPORG_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update readme and directory assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mapped-places
          ASSETS_DIR: .wordpress-org
          IGNORE_OTHER_FILES: true
